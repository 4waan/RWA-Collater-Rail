name: Fresh scaffold gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fresh-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1 # renovate: foundry
      - name: Activate Yarn 3.2.3
        run: corepack enable && corepack prepare yarn@3.2.3 --activate
      - name: Configure scaffold commit identity
        run: |
          git config --global user.name "Collateral Rail CI"
          git config --global user.email "ci@collateral-rail.invalid"
      - name: Generate from the public template
        run: npm create scaffold-hbar@latest gate-check -- --template 4waan/RWA-Collater-Rail --yes --skip-hedera-skills
      - name: Install generated project
        working-directory: gate-check
        run: yarn install --immutable
      - name: Install Chromium
        working-directory: gate-check
        run: yarn workspace @collateral-rail/nextjs exec playwright install --with-deps chromium
      - name: Release validation
        working-directory: gate-check
        env:
          FOUNDRY_PROFILE: ci
        run: yarn release:validate
      - name: Retain Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fresh-scaffold-playwright-failure
          path: |
            gate-check/packages/nextjs/test-results
            gate-check/packages/nextjs/playwright-report
          if-no-files-found: ignore
          retention-days: 7
