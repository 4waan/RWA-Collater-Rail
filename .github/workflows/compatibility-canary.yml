name: Compatibility canary

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  read-only-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - name: Activate Yarn 3.2.3
        run: corepack enable && corepack prepare yarn@3.2.3 --activate
      - name: Install
        run: yarn install --immutable
      - name: Install Chromium
        run: yarn workspace @collateral-rail/nextjs exec playwright install --with-deps chromium
      - name: Validate against current Foundry
        env:
          FOUNDRY_PROFILE: ci
        run: yarn release:validate
      - name: Check public Hedera dependencies
        run: yarn check:compatibility
      - name: Retain Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-playwright-failure
          path: |
            packages/nextjs/test-results
            packages/nextjs/playwright-report
          if-no-files-found: ignore
          retention-days: 7
