name: Compatibility canary

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  read-only-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: stable
      - name: Activate Yarn 3.2.3
        run: corepack enable && corepack prepare yarn@3.2.3 --activate
      - name: Install
        run: yarn install --immutable
      - name: Install Chromium
        run: yarn workspace @collateral-rail/nextjs exec playwright install --with-deps chromium
      - name: Validate against current Foundry
        env:
          FOUNDRY_PROFILE: ci
        run: yarn release:validate
      - name: Check public Hedera dependencies
        run: yarn check:compatibility
      - name: Retain Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-playwright-failure
          path: |
            packages/nextjs/test-results
            packages/nextjs/playwright-report
          if-no-files-found: ignore
          retention-days: 7
